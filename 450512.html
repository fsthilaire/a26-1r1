<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemple — Jeu d'évasion</title>
<style>
  :root {
    --bg: #03120c;
    --board: #0a3a26;
    --gold: #f0c14b;
    --gold-dim: #7a6428;
    --led: #39ff88;
    --cyan: #4de1ff;
    --copper: #e08a3c;
    --text: #d8ffe8;
    --font: Consolas, "Courier New", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow-x: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #traces { z-index: 0; }
  #confetti { z-index: 3; pointer-events: none; }

  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px 16px;
    text-align: center;
  }
  .stage {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: 1fr; gap: 20px;
    align-items: center;
  }
  @media (min-width: 860px) { .stage { grid-template-columns: 1fr 1fr; } }

  #terminal {
    text-align: left;
    font-size: clamp(13px, 1.7vw, 19px);
    line-height: 1.6;
    min-height: 16.5em;
    padding: 16px 20px;
    background: rgba(2, 18, 11, .85);
    border: 1px solid rgba(240,193,75,.5);
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(57,255,136,.2);
    white-space: pre-wrap;
    color: var(--led);
  }
  #terminal .ok { color: var(--cyan); }
  .cursor::after { content: "\2588"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Schéma de la carte-mère */
  #board { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 18px rgba(0,0,0,.6)); }
  #board .pcb { fill: var(--board); stroke: var(--gold-dim); stroke-width: 2; }
  #board .trace { fill: none; stroke: var(--gold-dim); stroke-width: 1.5; opacity: .6; }
  #board .hole { fill: var(--bg); stroke: var(--gold-dim); stroke-width: 1.5; }
  #board .part rect, #board .part circle {
    fill: rgba(240,193,75,.06); stroke: var(--gold-dim); stroke-width: 1.5;
    transition: fill .3s, stroke .3s;
  }
  #board .part text {
    fill: var(--gold-dim); font: 700 9px var(--font); text-anchor: middle;
    transition: fill .3s;
  }
  #board .part.on { filter: drop-shadow(0 0 4px var(--led)); }
  #board .part.on rect, #board .part.on circle { fill: rgba(57,255,136,.2); stroke: var(--led); }
  #board .part.on text { fill: var(--led); }

  #message { visibility: hidden; }
  #message { margin-top: 32px; }
  #message.show { visibility: visible; }
  h1 {
    margin: 0;
    font-size: clamp(30px, 7.5vw, 84px);
    letter-spacing: .05em;
    color: var(--led);
    text-shadow: 0 0 12px var(--led), 0 0 32px rgba(57,255,136,.5);
  }
  .lead {
    margin: 20px 0 8px;
    font-size: clamp(20px, 4vw, 40px);
    color: var(--gold);
    text-shadow: 0 0 10px rgba(240,193,75,.5);
  }
  .sub {
    margin: 0 auto;
    max-width: 680px;
    font-size: clamp(15px, 2.2vw, 22px);
  }

  .badge {
    margin: 0 0 20px; padding: 6px 22px;
    font-size: clamp(18px, 3vw, 30px); font-weight: 700; letter-spacing: .3em;
    color: var(--bg); background: var(--gold);
    border-radius: 4px; box-shadow: 0 0 18px rgba(240,193,75,.5);
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor::after { animation: none; }
    #board .part, #board .part rect, #board .part circle, #board .part text { transition: none; }
  }
</style>
</head>
<body>
<canvas id="traces" aria-hidden="true"></canvas>

<main>
  <div class="badge">EXEMPLE</div>
  <div class="stage">
    <div id="terminal" class="cursor" aria-label="Séquence d'identification du matériel"></div>

    <svg id="board" viewBox="0 0 400 290" role="img" aria-label="Schéma d'une carte-mère avec ses composants : processeur, mémoire vive, chipset, carte graphique, SSD, ports SATA, alimentation, pile CMOS et ports d'entrée-sortie">
      <rect class="pcb" x="4" y="4" width="392" height="282" rx="10"/>
      <circle class="hole" cx="18" cy="18" r="4"/><circle class="hole" cx="382" cy="18" r="4"/>
      <circle class="hole" cx="18" cy="272" r="4"/><circle class="hole" cx="382" cy="272" r="4"/>
      <path class="trace" d="M58 60 H100 M58 100 H100 M180 90 H215 M140 130 V165 M156 188 H175 M110 188 H84 M247 200 H300 M270 170 V238 M340 90 H346 M180 110 H200 V232"/>

      <g class="part" id="p-io"><rect x="14" y="30" width="44" height="100" rx="3"/><text x="36" y="84">E/S</text></g>
      <g class="part" id="p-cpu"><rect x="100" y="50" width="80" height="80" rx="4"/><rect x="120" y="70" width="40" height="40" rx="2"/><text x="140" y="94">CPU</text></g>
      <g class="part" id="p-ram">
        <rect x="215" y="40" width="8" height="118"/><rect x="229" y="40" width="8" height="118"/>
        <rect x="243" y="40" width="8" height="118"/><rect x="257" y="40" width="8" height="118"/>
        <text x="240" y="172">RAM</text>
      </g>
      <g class="part" id="p-chipset"><rect x="110" y="165" width="46" height="46" rx="3"/><text x="133" y="191">CHIPSET</text></g>
      <g class="part" id="p-gpu"><rect x="40" y="245" width="230" height="16" rx="2"/><text x="155" y="257">PCIe x16 · GPU</text></g>
      <g class="part" id="p-m2"><rect x="175" y="194" width="72" height="16" rx="2"/><text x="211" y="206">SSD M.2</text></g>
      <g class="part" id="p-sata"><rect x="300" y="200" width="54" height="12"/><rect x="300" y="218" width="54" height="12"/><text x="327" y="246">SATA</text></g>
      <g class="part" id="p-psu"><rect x="346" y="40" width="30" height="96" rx="2"/><text x="361" y="88" transform="rotate(-90 361 88)">ATX 24 br.</text></g>
      <g class="part" id="p-cmos"><circle cx="68" cy="190" r="17"/><text x="68" y="193" style="font-size:8px">CMOS</text></g>
    </svg>
  </div>

  <section id="message" aria-live="polite">
    <h1>PAGE EXEMPLE</h1>
    <p class="lead">Ceci est la page exemple du jeu d'évasion.</p>
    <p class="sub">Dans le jeu, vous devrez identifier les composants d'une carte-mère&nbsp;: processeur, mémoire vive, carte graphique, stockage et alimentation. Cette page présente seulement le thème du jeu.</p>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Pistes de circuit imprimé animées ---------- */
  function startTraces() {
    var c = document.getElementById("traces"), ctx = c.getContext("2d");
    var base = document.createElement("canvas"), bctx = base.getContext("2d");
    var step = 24, traces = [], pulses = [];

    function build() {
      c.width = base.width = window.innerWidth;
      c.height = base.height = window.innerHeight;
      traces = []; pulses = [];
      var n = Math.round(c.width * c.height / 9000);
      for (var i = 0; i < n; i++) {
        var x = Math.round(Math.random() * c.width / step) * step;
        var y = Math.round(Math.random() * c.height / step) * step;
        var pts = [[x, y]], horiz = Math.random() < .5, len = 0, segs = [];
        for (var s = 0; s < 3 + Math.floor(Math.random() * 4); s++) {
          var d = (2 + Math.floor(Math.random() * 5)) * step * (Math.random() < .5 ? -1 : 1);
          if (horiz) x += d; else y += d;
          horiz = !horiz;
          var p = pts[pts.length - 1];
          len += Math.abs(x - p[0]) + Math.abs(y - p[1]);
          segs.push(len);
          pts.push([x, y]);
        }
        traces.push({ pts: pts, segs: segs, len: len });
        if (Math.random() < .35) pulses.push({ t: traces[i], d: Math.random() * len, v: 40 + Math.random() * 60 });
      }
      bctx.clearRect(0, 0, base.width, base.height);
      bctx.strokeStyle = "rgba(240,193,75,.14)"; bctx.lineWidth = 2;
      bctx.fillStyle = "rgba(240,193,75,.22)";
      traces.forEach(function (t) {
        bctx.beginPath();
        t.pts.forEach(function (p, i) { i ? bctx.lineTo(p[0], p[1]) : bctx.moveTo(p[0], p[1]); });
        bctx.stroke();
        [t.pts[0], t.pts[t.pts.length - 1]].forEach(function (p) {
          bctx.beginPath(); bctx.arc(p[0], p[1], 4, 0, Math.PI * 2); bctx.fill();
        });
      });
      ctx.drawImage(base, 0, 0);
    }
    function pointAt(t, d) {
      d = d % t.len;
      var i = 0; while (t.segs[i] < d) i++;
      var a = t.pts[i], b = t.pts[i + 1], start = i ? t.segs[i - 1] : 0;
      var k = (d - start) / (t.segs[i] - start);
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    }
    build();
    var timer;
    window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(build, 150); });
    if (reduce) return;
    var last = performance.now();
    (function frame(now) {
      var dt = (now - last) / 1000; last = now;
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.drawImage(base, 0, 0);
      ctx.fillStyle = "#39ff88"; ctx.shadowColor = "#39ff88"; ctx.shadowBlur = 8;
      pulses.forEach(function (p) {
        p.d += p.v * dt;
        var pt = pointAt(p.t, p.d);
        ctx.beginPath(); ctx.arc(pt[0], pt[1], 2.5, 0, Math.PI * 2); ctx.fill();
      });
      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    })(last);
  }

  /* ---------- Séquence d'identification ---------- */
  var lines = [
    ["> CPU · processeur ", "[à identifier]", "p-cpu"],
    ["> RAM · mémoire vive ", "[à identifier]", "p-ram"],
    ["> Chipset ", "[à identifier]", "p-chipset"],
    ["> Carte graphique · PCIe ", "[à identifier]", "p-gpu"],
    ["> SSD · M.2 ", "[à identifier]", "p-m2"],
    ["> Ports SATA ", "[à identifier]", "p-sata"],
    ["> Alimentation · 24 broches ", "[à identifier]", "p-psu"],
    ["> Pile CMOS ", "[à identifier]", "p-cmos"],
    ["> Ports E/S ", "[à identifier]", "p-io"],
    ["> ", "PAGE EXEMPLE DU JEU D'ÉVASION", null]
  ];
  function light(id) { if (id) document.getElementById(id).classList.add("on"); }
  function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function renderAll(term) {
    term.innerHTML = lines.map(function (l) {
      return escapeHtml(l[0]) + '<span class="ok">' + escapeHtml(l[1]) + "</span>";
    }).join("\n");
    lines.forEach(function (l) { light(l[2]); });
  }
  function typeLines(term, done) {
    if (reduce) { renderAll(term); done(); return; }
    var li = 0, part = 0, ci = 0, html = "";
    function step() {
      if (li >= lines.length) { setTimeout(done, 400); return; }
      if (part === 0 && ci === 0) light(lines[li][2]);
      var text = lines[li][part];
      if (ci < text.length) {
        var ch = escapeHtml(text.charAt(ci++));
        html += part === 1 ? '<span class="ok">' + ch + "</span>" : ch;
        term.innerHTML = html;
        setTimeout(step, 16);
      } else {
        ci = 0;
        if (part === 0) { part = 1; setTimeout(step, 200); }
        else { part = 0; li++; html += "\n"; setTimeout(step, 150); }
      }
    }
    step();
  }

  /* ---------- Confettis ---------- */
  var confettiRunning = false;
  function launchConfetti() {
    if (confettiRunning) return;
    confettiRunning = true;
    var c = document.getElementById("confetti"), ctx = c.getContext("2d");
    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
    resize();
    window.addEventListener("resize", resize);
    var colors = ["#f0c14b", "#39ff88", "#4de1ff", "#e08a3c"];
    var count = reduce ? 40 : 220;
    var parts = [];
    for (var i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * c.width,
        y: -Math.random() * c.height * .6,
        w: 6 + Math.random() * 8,
        h: 10 + Math.random() * 10,
        round: Math.random() < .3,
        vx: (Math.random() - .5) * 3,
        vy: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - .5) * .3,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    function frame() {
      ctx.clearRect(0, 0, c.width, c.height);
      var alive = 0;
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += .03;
        if (p.y < c.height + 30) {
          alive++;
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
          else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      }
      if (alive > 0) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, c.width, c.height); window.removeEventListener("resize", resize); confettiRunning = false; }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Orchestration ---------- */
  startTraces();
  var term = document.getElementById("terminal");
  typeLines(term, function () {
    term.classList.remove("cursor");
    document.getElementById("message").classList.add("show");
    launchConfetti();
  });
})();
</script>
</body>
</html>
