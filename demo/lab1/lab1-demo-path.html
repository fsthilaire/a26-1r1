<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chemin absolu — Explorateur Windows</title>
<style>
  :root{
    --bg:#eef0f3;
    --win-bg:#ffffff;
    --titlebar:#f5f6f8;
    --border:#ced1d6;
    --sidebar:#f7f8fa;
    --address-seg-active:#cce4f7;
    --text:#1a1a1a;
    --muted:#6e7278;
    --folder:#ffca3d;
    --folder-dk:#f0b018;
    --accent:#0067c0;
    --hilite:#cce4f7;
    --hilite-border:#0067c0;
    --c1:#d62828; /* C: */
    --c2:#21853e; /* niveau 1 */
    --c3:#b05a00; /* niveau 2 */
    --c4:#0067c0; /* niveau 3 */
    --c5:#8028a0; /* niveau 4 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:#dfe3e8;
    color:var(--text);
    padding:28px 20px 60px;
  }
  h1{
    text-align:center;
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:.2px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:0 0 28px;
  }
  .layout{
    max-width:1120px;
    margin:0 auto;
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }
  .panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    width:300px;
    flex-shrink:0;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0 0 12px;
  }
  .path-btn{
    display:flex;
    align-items:center;
    width:100%;
    text-align:left;
    background:#f4f5f7;
    border:1px solid #e2e4e8;
    border-radius:7px;
    padding:9px 12px;
    margin-bottom:8px;
    font-family:'Consolas','SFMono-Regular',Menlo,monospace;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
    white-space:pre;
  }
  .path-btn:hover{ background:#eaf2fb; border-color:#b9d8f2; }
  .path-btn:active{ transform:scale(0.98); }
  .path-btn.playing{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .path-btn{ position:relative; padding-left:16px; }
  .path-btn::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    border-radius:7px 0 0 7px;
    background:var(--depth-color, #d7dae0);
  }
  .replay-btn{
    margin-top:6px;
    width:100%;
    padding:9px;
    border-radius:7px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:13px;
    cursor:pointer;
  }
  .replay-btn:hover{ background:#f4f5f7; }
  .replay-btn:disabled{ opacity:.4; cursor:default; }

  .stage{
    width:700px;
    max-width:100%;
    flex-shrink:0;
  }
  .win{
    position:relative;
    background:var(--win-bg);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 24px rgba(20,20,30,.08);
  }
  .titlebar{
    height:40px;
    background:var(--titlebar);
    display:flex;
    align-items:center;
    padding:0 14px;
    font-weight:700;
    font-size:14px;
    border-bottom:1px solid #eceef1;
  }
  .dots{ margin-left:auto; display:flex; gap:8px; }
  .dot{ width:12px;height:12px;border-radius:50%; background:#aab0b8; }
  .dot.red{ background:#c83c37; }

  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
  }
  .navbtn{
    width:26px;height:24px;
    border:1px solid #d5d8dd;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px; color:var(--muted);
  }
  .addressbar{
    flex:1;
    height:30px;
    border:1px solid var(--border);
    border-radius:6px;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:14px;
    gap:2px;
    overflow:hidden;
    white-space:nowrap;
  }
  .crumb{
    padding:3px 7px;
    border-radius:5px;
    color:var(--text);
    transition:background .25s, color .25s;
  }
  .crumb.active{
    background:var(--address-seg-active);
    color:var(--accent);
    font-weight:700;
  }
  .crumb-sep{ color:var(--muted); font-weight:700; padding:0 1px; }
  .searchbox{
    width:80px;height:30px;
    border:1px solid var(--border);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:13px;
    flex-shrink:0;
  }

  .body-row{ display:flex; }
  .sidebar{
    width:150px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:14px 0 0;
    flex-shrink:0;
  }
  .side-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 14px;
    font-size:13px;
    color:var(--muted);
  }
  .side-folder{
    width:14px;height:11px;background:var(--folder);border-radius:2px;position:relative;flex-shrink:0;
  }
  .side-folder::before{
    content:'';position:absolute;top:-3px;left:0;width:45%;height:4px;background:var(--folder);border-radius:2px 2px 0 0;
  }

  .content{
    flex:1;
    min-height:290px;
    padding:14px 22px 22px;
    position:relative;
  }
  .content-label{
    font-size:12px; color:var(--muted); margin-bottom:14px;
  }
  .grid{
    display:flex;
    flex-wrap:wrap;
    gap:26px 18px;
  }
  .item{
    width:96px;
    text-align:center;
    padding:8px 4px 10px;
    border-radius:6px;
    border:1px solid transparent;
    transition:background .2s, border-color .2s;
  }
  .item.selected{
    background:var(--hilite);
    border-color:var(--hilite-border);
  }
  .folder-icon{
    width:48px;height:36px;
    background:var(--folder);
    border-radius:5px;
    position:relative;
    margin:4px auto 8px;
  }
  .folder-icon::before{
    content:'';
    position:absolute;
    top:-8px;left:0;
    width:46%;height:10px;
    background:var(--folder);
    border-radius:4px 4px 0 0;
  }
  .item-label{
    font-size:12.5px;
    word-break:break-word;
    line-height:1.25;
  }
  .empty-msg{
    color:#a7abb2;
    font-size:14px;
    padding:30px 0 0 4px;
    font-style:italic;
  }

  .cursor{
    position:absolute;
    width:22px;height:26px;
    left:0; top:0;
    pointer-events:none;
    transition:left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1), opacity .2s;
    opacity:0;
    z-index:5;
  }
  .cursor svg{ display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .click-ring{
    position:absolute;
    width:34px;height:34px;
    left:-6px; top:-4px;
    border:2px solid var(--accent);
    border-radius:50%;
    opacity:0;
    pointer-events:none;
  }
  .click-ring.fire{
    animation:ring .45s ease-out;
  }
  @keyframes ring{
    0%{ opacity:.9; transform:scale(.4); }
    100%{ opacity:0; transform:scale(1.25); }
  }

  .banner{
    margin-top:16px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 18px;
    transition:border-color .3s, background .3s;
  }
  .banner.done{
    border-color:#21853e;
    background:#f3fbf5;
  }
  .banner-label{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .banner-label.done{ color:#21853e; font-weight:700; }
  .banner-path{
    font-family:'Consolas','SFMono-Regular',Menlo,monospace;
    font-size:19px;
    letter-spacing:.2px;
    min-height:26px;
  }
  .banner-path .seg{
    opacity:0;
    transform:translateY(4px);
    display:inline-block;
    animation:pop .3s ease forwards;
  }
  @keyframes pop{
    to{ opacity:1; transform:translateY(0); }
  }
  .placeholder-text{
    color:#b3b6bc;
    font-style:italic;
    font-size:15px;
  }

  @media (max-width:760px){
    .layout{ flex-direction:column; align-items:center; }
    .panel{ width:100%; max-width:420px; }
    .stage{ width:100%; max-width:420px; }
    .sidebar{ display:none; }
  }
</style>
</head>
<body>

<h1>Comprendre le chemin absolu</h1>
<p class="subtitle">Clique sur un chemin pour voir la navigation, dossier par dossier</p>

<div class="layout">

  <div class="panel">
    <h2>Chemins à explorer</h2>
    <div id="pathList"></div>
    <button class="replay-btn" id="replayBtn" disabled>↻ Rejouer l'animation</button>
  </div>

  <div class="stage">
    <div class="win" id="win">
      <div class="titlebar">
        <span id="titlebarText">Ce PC</span>
        <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot red"></span></div>
      </div>
      <div class="toolbar">
        <div class="navbtn">←</div>
        <div class="navbtn" style="color:#d8dadd;">→</div>
        <div class="addressbar" id="addressbar"></div>
        <div class="searchbox">🔍</div>
      </div>
      <div class="body-row">
        <div class="sidebar">
          <div class="side-item"><span class="side-folder"></span>accès rapide</div>
          <div class="side-item"><span class="side-folder"></span>ce pc</div>
          <div class="side-item"><span class="side-folder"></span>documents</div>
          <div class="side-item"><span class="side-folder"></span>images</div>
        </div>
        <div class="content" id="content">
          <div class="content-label" id="contentLabel">Ce PC</div>
          <div class="grid" id="grid"></div>
          <div class="cursor" id="cursor">
            <div class="click-ring" id="clickRing"></div>
            <svg width="22" height="26" viewBox="0 0 22 26">
              <polygon points="1,1 1,19 5.5,15 8,21 11,19.5 8.5,14 14,14" fill="#141414" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="banner" id="banner">
      <div class="banner-label" id="bannerLabel">Chemin absolu :</div>
      <div class="banner-path" id="bannerPath"><span class="placeholder-text">(en construction…)</span></div>
    </div>
  </div>

</div>

<script>
// ---------- Structure des dossiers ----------
const tree = {
  "projets": {
    "1n1": {
      "cours1": {}
    },
    "1r1": {},
    "1w1": {
      "exercices": {},
      "travaux": {
        "tp1": {},
        "tp2": {}
      }
    }
  }
};

const paths = [
  "c:\\projets\\",
  "c:\\projets\\1n1\\",
  "c:\\projets\\1n1\\cours1\\",
  "c:\\projets\\1r1\\",
  "c:\\projets\\1w1\\",
  "c:\\projets\\1w1\\exercices\\",
  "c:\\projets\\1w1\\travaux\\",
  "c:\\projets\\1w1\\travaux\\tp1\\",
  "c:\\projets\\1w1\\travaux\\tp2\\"
];

const PATH_COLORS = ["c1","c2","c3","c4","c5"];
const DRIVE_LABEL = "Disque local (C:)";

// ---------- DOM refs ----------
const pathListEl = document.getElementById('pathList');
const replayBtn = document.getElementById('replayBtn');
const titlebarText = document.getElementById('titlebarText');
const addressbar = document.getElementById('addressbar');
const content = document.getElementById('content');
const contentLabel = document.getElementById('contentLabel');
const grid = document.getElementById('grid');
const cursor = document.getElementById('cursor');
const clickRing = document.getElementById('clickRing');
const banner = document.getElementById('banner');
const bannerLabel = document.getElementById('bannerLabel');
const bannerPath = document.getElementById('bannerPath');
const winEl = document.getElementById('win');

let version = 0;
let lastSegments = null;
let lastButtons = [];

// ---------- Construire la liste de boutons ----------
const DEPTH_COLORS = ["#d62828","#21853e","#b05a00","#0067c0","#8028a0"];

paths.forEach(p => {
  const segs = p.replace(/^c:\\/i,'').split('\\').filter(Boolean);
  const depth = segs.length - 1;
  const btn = document.createElement('button');
  btn.className = 'path-btn';
  btn.style.setProperty('--depth-color', DEPTH_COLORS[depth % DEPTH_COLORS.length]);
  btn.textContent = p;
  btn.addEventListener('click', () => play(segs, btn));
  pathListEl.appendChild(btn);
  lastButtons.push(btn);
});

replayBtn.addEventListener('click', () => {
  if (lastSegments) {
    const btn = lastButtons.find(b => b.classList.contains('current'));
    play(lastSegments, btn);
  }
});

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function getNode(segs){
  let node = tree;
  for (const s of segs){
    if (!node[s]) return {};
    node = node[s];
  }
  return node;
}

function setActiveButton(btn){
  lastButtons.forEach(b => { b.classList.remove('playing'); b.classList.remove('current'); });
  if (btn){ btn.classList.add('playing'); btn.classList.add('current'); }
  replayBtn.disabled = false;
}

function renderBreadcrumb(labels, activeIdx){
  addressbar.innerHTML = '';
  labels.forEach((lab, i) => {
    const span = document.createElement('span');
    span.className = 'crumb' + (i === activeIdx ? ' active' : '');
    span.textContent = lab;
    addressbar.appendChild(span);
    if (i < labels.length - 1){
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '›';
      addressbar.appendChild(sep);
    }
  });
}

function renderGrid(childrenObj, selectedName){
  grid.innerHTML = '';
  const names = Object.keys(childrenObj);
  if (names.length === 0){
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = '(dossier vide)';
    grid.appendChild(msg);
    // re-append cursor (it lives in .content, not .grid, so nothing to do)
    return;
  }
  names.forEach(name => {
    const it = document.createElement('div');
    it.className = 'item' + (name === selectedName ? ' selected' : '');
    it.dataset.name = name;
    it.innerHTML = '<div class="folder-icon"></div><div class="item-label">' + name + '</div>';
    grid.appendChild(it);
  });
}

function bannerSegHTML(text, colorClass){
  return '<span class="seg" style="color:var(--' + colorClass + ')">' + text + '</span>';
}

function updateBanner(builtSegs, done, driveSelected){
  if (builtSegs.length === 0 && !driveSelected){
    bannerPath.innerHTML = '<span class="placeholder-text">(en construction…)</span>';
    bannerLabel.textContent = 'Chemin absolu :';
    bannerLabel.classList.remove('done');
    banner.classList.remove('done');
    return;
  }
  let html = bannerSegHTML('C:', 'c1');
  builtSegs.forEach((seg, i) => {
    html += bannerSegHTML('\\' + seg, PATH_COLORS[(i+1) % PATH_COLORS.length]);
  });
  html += bannerSegHTML('\\', PATH_COLORS[builtSegs.length % PATH_COLORS.length]);
  bannerPath.innerHTML = html;
  if (done){
    bannerLabel.textContent = 'Chemin absolu complet ✓';
    bannerLabel.classList.add('done');
    banner.classList.add('done');
  } else {
    bannerLabel.textContent = 'Chemin absolu :';
    bannerLabel.classList.remove('done');
    banner.classList.remove('done');
  }
}

async function moveCursorTo(el){
  const contentRect = content.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const x = elRect.left - contentRect.left + elRect.width/2 - 11;
  const y = elRect.top - contentRect.top + 14;
  cursor.style.opacity = '1';
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  await sleep(560);
}

async function clickFlash(){
  clickRing.classList.remove('fire');
  void clickRing.offsetWidth; // reflow to restart animation
  clickRing.classList.add('fire');
  await sleep(280);
}

async function play(segs, btn){
  const v = ++version;
  lastSegments = segs;
  setActiveButton(btn);
  cursor.style.opacity = '0';

  // état initial : Ce PC (racine), montrant les lecteurs
  titlebarText.textContent = 'Ce PC';
  renderBreadcrumb(['Ce PC'], 0);
  contentLabel.textContent = 'Ce PC';
  renderGrid({ [DRIVE_LABEL]: {}, "Disque D (D:)": {} }, null);
  updateBanner([], false);
  await sleep(700);
  if (v !== version) return;

  // cliquer sur le disque C:
  let driveItem = [...grid.children].find(el => el.dataset && el.dataset.name === DRIVE_LABEL);
  if (driveItem){
    await moveCursorTo(driveItem);
    if (v !== version) return;
    driveItem.classList.add('selected');
    await clickFlash();
    if (v !== version) return;
  }
  await sleep(150);

  // entrer dans C:
  let breadcrumbLabels = ['Ce PC', DRIVE_LABEL];
  titlebarText.textContent = DRIVE_LABEL;
  renderBreadcrumb(breadcrumbLabels, 1);
  contentLabel.textContent = DRIVE_LABEL;
  cursor.style.opacity = '0';
  let node = tree;
  renderGrid(node, null);
  updateBanner([], false, true);
  await sleep(750);
  if (v !== version) return;

  // parcourir chaque segment du chemin
  const built = [];
  for (let i = 0; i < segs.length; i++){
    const seg = segs[i];
    const items = [...grid.children].filter(el => el.dataset && el.dataset.name);
    const target = items.find(el => el.dataset.name === seg);
    if (target){
      await moveCursorTo(target);
      if (v !== version) return;
      target.classList.add('selected');
      await clickFlash();
      if (v !== version) return;
    }
    await sleep(120);

    built.push(seg);
    node = node[seg] || {};
    breadcrumbLabels = ['Ce PC', DRIVE_LABEL, ...built];
    titlebarText.textContent = seg;
    renderBreadcrumb(breadcrumbLabels, breadcrumbLabels.length - 1);
    contentLabel.textContent = seg;
    cursor.style.opacity = '0';
    renderGrid(node, null);
    updateBanner(built, i === segs.length - 1);
    await sleep(i === segs.length - 1 ? 400 : 850);
    if (v !== version) return;
  }
}

// jouer automatiquement le premier chemin au chargement, pour montrer l'idée
window.addEventListener('load', () => {
  play(paths[0].replace(/^c:\\/i,'').split('\\').filter(Boolean), lastButtons[0]);
});
</script>

</body>
</html>
